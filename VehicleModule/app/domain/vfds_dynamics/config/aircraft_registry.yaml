# Aircraft Registry
# 각 aircraftId에 대응하는 타겟 항공기 접속 정보
# Mission Dispatcher가 이 파일을 참조하여 미션을 라우팅한다.

aircraft:
  UAM0001:
    type: "SITL"
    instance_id: 0
    connection_string: "udpin://0.0.0.0:14540"
    mavsdk_port: 50051
    send_protocol: "scp"
    send_host: "203.252.161.188"
    send_port: 22
    execution_mode: "remote"
    script_deploy_path: "~/missions"
    python_executable: "python3"
    ssh_password: "kada123"
    status: "available"
    home_lat: 37.562899
    home_lon: 126.792416
    home_alt: 34.6
    mavlink_sysid: 1
    sitl:
      enabled: true
      vfds_command_template: "cd ~/git/vfds/run && python3.12 run_vehicle_multi.py --port 4560 --no-px4 --lat {home_lat} --lon {home_lon} --alt {home_alt}"
      command_template: "cd ~/PX4-Autopilot && PX4_HOME_LAT={home_lat} PX4_HOME_LON={home_lon} PX4_HOME_ALT={home_alt} PX4_SIM_MODEL=kp2 ./build/px4_sitl_default/bin/px4 -i 0"
      stop_pattern: "px4 -i 0|run_vehicle_multi.py --port 4560|mavsdk_server.*50051|python3.*UAM0001"

