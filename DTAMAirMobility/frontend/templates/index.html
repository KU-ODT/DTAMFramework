<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>DTAM 에어모빌리티 — 4001 송신기</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<header class="topbar">
  <h1>DTAM 에어모빌리티</h1>
  <div class="subtitle">비행계획 → 10 Hz 궤적 생성 → DTAM 4001 송신</div>
</header>

<main>
  <section class="card">
    <h2>송신기 설정 (UDP 4001)</h2>
    <div class="row">
      <label>수신 IP <input id="targetIp" placeholder="127.0.0.1" /></label>
      <label>수신 포트 <input id="targetPort" type="number" min="1" max="65535" /></label>
      <label>내 포트 <input id="myPort" type="number" min="1" max="65535" /></label>
      <button id="applyPublisher">적용</button>
    </div>
    <div class="status-line" id="publisherStatus">—</div>
  </section>

  <section class="card">
    <h2>비행계획</h2>
    <div class="row">
      <input id="planFiles" type="file" accept=".json" multiple />
      <button id="uploadPlans">업로드</button>
      <button id="clearPlans" class="danger">전체 삭제</button>
    </div>
    <div class="status-line">
      파일로 직접 업로드하거나, 외부에서 <code>MSG 3001</code> 을 UDP 로 보내면
      자동으로 등록됩니다.
    </div>
    <ul id="planList" class="plan-list">
      <li class="empty">등록된 비행계획이 없습니다.</li>
    </ul>
  </section>

  <section class="card">
    <h2>DTAM 수신 상태</h2>
    <div class="status-line" id="rxStatus">—</div>
  </section>

  <section class="card">
    <h2>시계 및 서비스</h2>
    <div class="row">
      <label>시계 모드
        <select id="clockMode">
          <option value="external">external (외부)</option>
          <option value="wall">wall (실시간)</option>
          <option value="manual">manual (수동)</option>
        </select>
      </label>
      <label>시각 HH:MM:SS <input id="hms" value="09:10:00" /></label>
      <button id="feedTime">시간 주입</button>
      <button id="stepOnce">1 틱 실행</button>
      <button id="startService" class="primary">서비스 시작</button>
      <button id="stopService" class="danger" disabled>서비스 정지</button>
    </div>
    <div class="status-line" id="serviceStatus">—</div>
  </section>

  <section class="card">
    <h2>비행체 현황</h2>
    <table class="fleet">
      <thead>
        <tr>
          <th>비행체</th>
          <th>계획번호</th>
          <th>상태</th>
          <th>이륙시각</th>
          <th>경과</th>
          <th>웨이포인트</th>
          <th>위도/경도/고도</th>
          <th>N/E/D (m)</th>
        </tr>
      </thead>
      <tbody id="fleetBody">
        <tr><td colspan="8" class="empty">진행 중인 비행이 없습니다.</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script src="/static/js/app.js"></script>
</body>
</html>
